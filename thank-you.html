<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#FFFFF7">
  <title>Thank You | SM Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#FFFFF7; --green:#13B690; --border:#A7F3D0; --yellow:#FFF36F; --muted:#5D5F5F; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { min-height:100%; }
    body { font-family:"Plus Jakarta Sans",sans-serif; background:#000; color:#111; display:grid; place-items:center; padding:20px; }
    .card { width:min(680px,100%); background:var(--bg); border:1.5px solid var(--border); border-radius:24px; padding:clamp(28px,6vw,58px); text-align:center; box-shadow:5px 5px 0 var(--border); }
    .check { width:74px; height:74px; margin:0 auto 22px; border-radius:50%; display:grid; place-items:center; background:#ECFDF5; border:2px solid var(--green); color:var(--green); font-size:38px; font-weight:800; }
    .pill { display:inline-flex; border:1.5px solid var(--border); border-radius:999px; padding:7px 14px; background:#fff; font-size:12px; font-weight:800; margin-bottom:18px; }
    h1 { font:800 clamp(34px,6vw,52px)/1.05 "Space Grotesk",sans-serif; letter-spacing:-.04em; margin-bottom:14px; }
    p { color:var(--muted); line-height:1.7; font-size:15px; max-width:530px; margin:0 auto; }
    .ref { margin:22px auto; padding:13px 16px; background:#fff; border:1px dashed var(--border); border-radius:12px; font:700 13px "Space Grotesk",sans-serif; }
    .buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:22px; }
    a { text-decoration:none; font-weight:800; font-size:14px; padding:12px 19px; border-radius:12px; border:1.5px solid var(--border); }
    .primary { background:var(--yellow); color:#111; }
    .dark { background:#111; color:#fff; }
    .font-serif { font-family:"Playfair Display",serif; font-style:italic; }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <div class="pill">REQUEST RECEIVED</div>
    <h1>Thank you for reaching out.</h1>
    <p class="font-serif">Your growth consultation request has been submitted successfully. Our team will review your details and get back to you as soon as possible.</p>
    <div class="ref">Reference: <span id="reference">SM-REQUEST</span></div>
    <div class="buttons">
      <a class="primary" href="index.html#home">Back to Website →</a>
      <a class="dark" href="https://wa.me/8801332840702?text=Hello%20SM%20Technology%2C%20I%20just%20submitted%20a%20growth%20consultation%20request." target="_blank" rel="noopener noreferrer">WhatsApp Us</a>
    </div>
  </main>

  <script>
    const ref = sessionStorage.getItem("sm_lead_reference");
    if (ref) document.getElementById("reference").textContent = ref;
  </script>
</body>
</html>
